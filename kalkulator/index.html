<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Kalkulator - Copy Hasil & Dukungan Keyboard</title>
  <style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:radial-gradient(circle at 30% 10%,#0a0f1e,#020617);display:flex;justify-content:center;align-items:center;font-family:Segoe UI,Poppins,Inter,system-ui,monospace;padding:1rem}.calculator{max-width:580px;width:100%;background:rgba(12,18,34,.85);backdrop-filter:blur(14px);border-radius:3rem;padding:1.5rem;box-shadow:0 25px 45px -12px rgba(0,0,0,.8),inset 0 1px 0 hsla(0,0%,100%,.05);border:1px solid rgba(56,189,248,.2)}.display-area{margin-bottom:1rem}.display-container{background:#01010e;border-radius:2rem;padding:.3rem 1.2rem;box-shadow:inset 0 5px 10px rgba(0,0,0,.6),0 1px 0 hsla(0,0%,100%,.05);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}#display{flex:1;background:transparent;border:none;color:#c0fdf4;font-size:2.4rem;font-weight:500;font-family:Courier New,Fira Code,monospace;text-align:right;padding:.9rem .2rem;word-wrap:break-word;word-break:break-all;white-space:pre-wrap;line-height:1.3;letter-spacing:.5px;user-select:text;cursor:text}#display:focus{outline:none}.copy-btn{background:#1e293b;border:none;color:#7dd3fc;font-size:1.3rem;padding:.4rem .8rem;border-radius:2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.3rem;font-weight:500;box-shadow:0 2px 5px rgba(0,0,0,.3)}.copy-btn:active{transform:scale(.96);background:#0f172a}.copy-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.8666666666666667);backdrop-filter:blur(8px);color:#a5f3fc;padding:.5rem 1.2rem;border-radius:2rem;font-size:.9rem;z-index:1000;pointer-events:none;opacity:0;transition:opacity .2s;font-family:monospace}.digit-setting{background:rgba(0,0,0,.45);border-radius:2rem;padding:.6rem 1rem;margin-bottom:1.5rem;flex-wrap:wrap;justify-content:space-between;gap:.8rem;border:1px solid #2d3a5e}.digit-setting,.setting-label{display:flex;align-items:center}.setting-label{gap:.5rem;color:#cbd5f0;font-weight:500;font   </style>
</head>
<body>
<div class="calculator">
  <div class="display-area">
    <div class="display-container">
      <div id="display" contenteditable="false">0</div>
      <button class="copy-btn" id="copyResultBtn" title="Salin hasil ke clipboard">📋 Copy</button>
    </div>
  </div>

  <div class="digit-setting">
    <div class="setting-label">
      <span>🔢</span> Batas digit angka (0-9)
    </div>
    <input type="range" id="maxDigitSlider" min="1" max="15" value="14" step="1">
    <div class="digit-badge" id="digitBadge">14</div>
  </div>

  <div class="button-grid">
    <button class="clear-btn" data-action="clear">AC</button>
    <button class="del-btn" data-action="backspace">⌫</button>
    <button class="operator-btn" data-op="%">%</button>
    <button class="operator-btn" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="operator-btn" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="operator-btn" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="operator-btn" data-op="+">+</button>

    <button data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equal-btn" data-action="equal">=</button>
    <button data-num="00" style="font-size:1.2rem;">00</button>
  </div>
</div>

<div id="copyToast" class="copy-toast">📋 Tersalin ke clipboard!</div>

</body>
</html>
