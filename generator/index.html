<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Form Generator</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/GoodForLife/webapp/refs/heads/main/asset/logos.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 3px solid #6366f1;
            padding-left: 14px;
        }

        /* ----- FORM CARD ----- */
        .form-card {
            background: #1a1f2b;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: 1px solid #2d3548;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            transition: border-color 0.2s;
        }
        .form-card:hover {
            border-color: #4a5568;
        }

        .form-index {
            font-weight: 600;
            color: #94a3b8;
            font-size: 14px;
            min-width: 32px;
        }

        .form-card select,
        .form-card input[type="text"],
        .form-card input[type="number"] {
            background: #0f141f;
            border: 1px solid #2d3548;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            color: #e2e8f0;
            height: 34px;
            outline: none;
            transition: border 0.2s;
        }
        .form-card select:focus,
        .form-card input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
        }
        .form-card select option {
            background: #1a1f2b;
        }
        .form-card .tipe-select {
            min-width: 60px;
        }
        .form-card .bet-input {
            width: 90px;
        }
        .form-card .single-input {
            width: 130px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .form-card .poltar-input {
            /* width: 50px; */
            text-align: center;
            font-weight: 500;
        }

        /* Checkbox fungsi (BB, BBFS, POLTAR) */
        .check-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            align-items: center;
        }
        .check-group label {
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .check-group input[type="checkbox"] {
            accent-color: #6366f1;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        /* Twin group */
        .twin-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            align-items: center;
            background: #1e293b;
            padding: 2px 12px 2px 8px;
            border-radius: 20px;
            border: 1px solid #2d3548;
            min-height: 34px;
        }
        .twin-group .twin-label {
            font-size: 12px;
            color: #94a3b8;
            margin-right: 2px;
        }
        .twin-group label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .twin-group input[type="checkbox"] {
            accent-color: #6366f1;
            width: 14px;
            height: 14px;
        }
        .twin-group .twin-badge {
            font-size: 10px;
            background: #2d3748;
            color: #93c5fd;
            padding: 0 8px;
            border-radius: 12px;

        .input-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .preview-text {
            font-size: 12px;
            color: #94a3b8;

            white-space: nowrap;
        }
        .btn-remove {

            border: none;
            color: #64748b;

            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .btn-remove:hover {
            color: #f87171;
        }

        /* ----- ACTION BAR ----- */
        .action-bar {
            background: #1a1f2b;
            border-radius: 12px;
            padding: 12px 20px;
            margin-top: 12px;
            border: 1px solid #2d3548;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
        }
        .action-bar .btn {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-bar .btn:hover {
            background: #4f46e5;
        }
        .action-bar .btn-outline {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid #3b4252;
        }
        .action-bar .btn-outline:hover {
            background: #2d3548;
            border-color: #6366f1;
        }
        .action-bar label {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-bar select {
            background: #0f141f;
            border: 1px solid #2d3548;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
            color: #e2e8f0;
            height: 32px;
            outline: none;
        }
        .action-bar select:focus {
            border-color: #6366f1;
        }
        .action-bar .form-count {
            font-size: 12px;
            color: #64748b;
            margin-left: auto;
        }

        /* ----- OUTPUT SECTION ----- */
        .output-section {
            background: #1a1f2b;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            border: 1px solid #2d3548;
            display: none;
        }
        .output-section.visible {
            display: block;
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .output-header .label {
            font-weight: 600;
            color: #94a3b8;
            font-size: 14px;
        }
        .btn-copy {
            background: #2d3748;
            border: 1px solid #4a5568;
            color: #e2e8f0;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 32px;
        }
        .btn-copy:hover {
            background: #3b4252;
            border-color: #6366f1;
        }
        .btn-copy.copied {
            background: #2b6b4c;
            border-color: #48bb78;
            color: #c6f6d5;
        }

        .output-box {
            background: #0f141f;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Courier New', monospace;
            /* font-size: 13px; */
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #2d3548;
            color: #e2e8f0;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .output-box.empty {
            color: #64748b;
            font-style: italic;
            font-family: 'Segoe UI', sans-serif;
        }
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 40px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #2d3548;
        }
        .badge-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .badge-item .num {
            font-weight: 700;
            font-size: 22px;
            color: #f1f5f9;
        }
        .badge-item .lbl {
            font-size: 13px;
            color: #94a3b8;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           RESPONSIVE MOBILE
           ============================================================ */
        @media (max-width: 820px) {
            .form-card {
                padding: 12px 14px;
                gap: 6px 10px;
                flex-direction: column;
                align-items: stretch;
            }

            .form-card .top-row {
                display: flex;
                align-items: center;
                gap: 8px 12px;
                width: 100%;
            }
            .form-card .top-row .form-index {
                flex: 0 0 auto;
            }
            .form-card .top-row .tipe-select {
                flex: 0 0 auto;
            }
            .form-card .top-row .btn-remove {
                margin-left: auto;
                flex: 0 0 auto;
            }

            .form-card .check-group {
                justify-content: center;
                width: 100%;
                gap: 6px 14px;
            }

            .form-card .twin-group {
                justify-content: center;
                width: 100%;
            }

            .form-card .single-input,
            .form-card .input-group {
                width: 100%;
                justify-content: center;
            }
            .form-card .single-input {
                max-width: 200px;
                margin: 0 auto;
            }
            .form-card .input-group {
                gap: 6px;
            }
            .form-card .poltar-input {
                width: 44px;
            }

            .form-card .bet-input {
                width: 100%;
                max-width: 180px;
                margin: 0 auto;
            }

            .form-card .preview-text {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }

            .action-bar {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 6px 12px;
                padding: 10px 14px;
            }
            .action-bar .btn {
                padding: 6px 16px;
                font-size: 13px;
            }
            .action-bar label {
                font-size: 12px;
            }
            .action-bar select {
                font-size: 12px;
                height: 28px;
                padding: 2px 6px;
            }
            .action-bar .form-count {
                margin-left: auto;
            }

            .output-header {
                flex-wrap: wrap;
                gap: 6px;
            }
            .btn-copy {
                font-size: 12px;
                padding: 2px 12px;
                height: 28px;
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 10px 10px;
            }
            .form-card .top-row {
                gap: 4px 8px;
            }
            .form-card .single-input {
                max-width: 160px;
                font-size: 12px;
            }
            .form-card .bet-input {
                max-width: 150px;
                font-size: 12px;
            }
            .form-card .poltar-input {
                width: 75px;
                /* font-size: 12px; */
            }
            .form-card .tipe-select {
                min-width: 50px;
                font-size: 12px;
            }
            .check-group label {
                font-size: 12px;
            }
            .twin-group label {
                font-size: 11px;
            }
            .action-bar .btn {
                padding: 5px 12px;
                font-size: 12px;
            }
            .action-bar label {
                font-size: 11px;
            }
            h1 {
                font-size: 22px;
            }
            .btn-copy {
                font-size: 11px;
                padding: 2px 10px;
                height: 26px;
            }
        }
    </style>

<body>
<div class="container" id="app">
    <h1>🧩 Form Generator</h1>
    <div class="subtitle">BB / BBFS / POLTAR</div>
    <div id="formsContainer"></div>
    <div class="action-bar">
        <button class="btn btn-outline" id="btnAddForm">＋ Add Form</button>
        <button class="btn" id="btnGenerateAll">⚡ Generate</button>
        <label>
            Delimiter
            <select id="delimForm">
                <option value="*">*</option>
                <option value="-">-</option>
                <option value="+">+</option>
                <option value=".">.</option>
                <option value=",">,</option>
                <option value="#">#</option>
                <option value="^">^</option>
            </select>
        </label>
        <label>
            Delimiter antar hasil
            <select id="delimAntar">
                <option value="+">+</option>
                <option value="*">*</option>
                <option value="-">-</option>
                <option value=".">.</option>
                <option value=",">,</option>
                <option value="#">#</option>
                <option value="^">^</option>
            </select>
        </label>
        <span class="form-count" id="formCountInfo">0 form</span>
    </div>

    <!-- Output Section -->
    <div class="output-section" id="outputSection">
        <div class="output-header">
            <span class="label">📄 Hasil Output</span>
            <button class="btn-copy" id="copyButton">📋 Salin</button>
        </div>
        <div class="output-box empty" id="outputBox">Klik "Generate Semua" untuk melihat hasil</div>
        <div class="badge-row">
            <div class="badge-item">
                <span class="lbl">Total Line</span>
                <span class="num" id="totalLines">0</span>
            </div>
            <div class="badge-item">
                <span class="lbl">Total Bet</span>
                <span class="num" id="totalBet">Rp 0</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  STATE
    // ============================================================
    let formCounter = 0;
    const forms = [];

    const container = document.getElementById('formsContainer');
    const outputSection = document.getElementById('outputSection');
    const outputBox = document.getElementById('outputBox');
    const totalLinesEl = document.getElementById('totalLines');
    const totalBetEl = document.getElementById('totalBet');
    const formCountInfo = document.getElementById('formCountInfo');
    const delimForm = document.getElementById('delimForm');
    const delimAntar = document.getElementById('delimAntar');
    const copyButton = document.getElementById('copyButton');

    // ============================================================
    //  HELPERS
    // ============================================================
    function getDigitCount(tipe) {
        return parseInt(tipe, 10);
    }

    function generatePermutationsFromMultiset(digits, len) {
        const freq = {};
        for (const d of digits) {
            freq[d] = (freq[d] || 0) + 1;
        }
        const uniqueDigits = Object.keys(freq);
        const result = [];

        function backtrack(path, remaining) {
            if (path.length === len) {
                result.push(path.join(''));
                return;
            }
            for (const d of uniqueDigits) {
                if (freq[d] > 0) {
                    freq[d]--;
                    path.push(d);
                    backtrack(path, remaining - 1);
                    path.pop();
                    freq[d]++;
                }
            }
        }
        backtrack([], len);
        return result;
    }

    function cartesianProduct(arrays) {
        if (arrays.length === 0) return [];
        if (arrays.length === 1) return arrays[0].split('').map(d => d);
        let result = arrays[0].split('').map(d => d);
        for (let i = 1; i < arrays.length; i++) {
            const next = arrays[i].split('');
            const newResult = [];
            for (const prefix of result) {
                for (const digit of next) {
                    newResult.push(prefix + digit);
                }
            }
            result = newResult;
        }
        return result;
    }

    function generateBB(inputStr) {
        if (!inputStr || inputStr.length === 0) return [];
        const rev = inputStr.split('').reverse().join('');
        if (rev === inputStr) return [inputStr];
        return [inputStr, rev];
    }

    function generateBBFS(inputStr, tipe) {
        const digits = inputStr.split('');
        if (digits.length === tipe) {
            return generatePermutationsFromMultiset(digits, tipe);
        }
        const freq = {};
        for (const d of digits) {
            freq[d] = (freq[d] || 0) + 1;
        }
        const unique = Object.keys(freq);
        const resultSet = new Set();

        function combine(start, selected, remaining) {
            if (selected.length === tipe) {
                const perms = generatePermutationsFromMultiset(selected, tipe);
                for (const p of perms) {
                    resultSet.add(p);
                }
                return;
            }
            if (start >= unique.length) return;
            const d = unique[start];
            const maxTake = Math.min(freq[d], tipe - selected.length);
            for (let k = 0; k <= maxTake; k++) {
                const newSelected = selected.concat(Array(k).fill(d));
                combine(start + 1, newSelected, remaining - k);
            }
        }
        combine(0, [], tipe);
        return Array.from(resultSet);
    }

    function generatePoltar(inputs) {
        if (inputs.some(s => s.length === 0)) return [];
        return cartesianProduct(inputs);
    }

    // ============================================================
    //  TWIN FILTER
    // ============================================================
    function getCategory(str) {
        const freq = {};
        for (const ch of str) {
            freq[ch] = (freq[ch] || 0) + 1;
        }
        const values = Object.values(freq);
        if (values.some(v => v === 4)) return 'fourplet';
        if (values.some(v => v === 3)) return 'triplet';
        const twos = values.filter(v => v === 2).length;
        if (twos === 2) return 'twintwin';
        if (twos === 1) return 'twin';
        return 'none';
    }

    function filterByTwinModes(results, twinModes) {
        const hasActive = Object.values(twinModes).some(v => v === true);
        if (!hasActive) {
            return results.filter(r => getCategory(r) === 'none');
        }
        return results.filter(r => {
            const cat = getCategory(r);
            if (cat === 'none') return true;
            if (cat === 'twin') return twinModes.twin;
            if (cat === 'twintwin') return twinModes.twintwin;
            if (cat === 'triplet') return twinModes.tripletwin;
            if (cat === 'fourplet') return twinModes.fourpletwin;
            return false;
        });
    }

    // ============================================================
    //  PROCESS A SINGLE FORM
    // ============================================================
    function processForm(formData) {
        const { tipe, fungsi, twinModes, inputs, bet } = formData;
        const digitCount = getDigitCount(tipe);
        let results = [];

        const isBB = fungsi.bb || false;
        const isBBFS = fungsi.bbfs || false;
        const isPoltar = fungsi.poltar || false;

        // ========== Jika semua fungsi mati ==========
        if (!isBB && !isBBFS && !isPoltar) {
            const inputStr = (inputs[0] || '').replace(/\D/g, '');
            if (inputStr.length === 0) {
                return { lines: [], count: 0, bet: bet || 0 };
            }
            return { lines: [inputStr], count: 1, bet: bet || 0 };
        }

        // ========== Fungsi aktif ==========
        if (isPoltar) {
            const cleanInputs = inputs.slice(0, digitCount).map(s => s.replace(/\D/g, ''));
            if (cleanInputs.some(s => s.length === 0)) {
                return { lines: [], count: 0, bet: bet || 0 };
            }
            let rawResults = generatePoltar(cleanInputs);
            rawResults = filterByTwinModes(rawResults, twinModes);
            results = rawResults;
        } else {
            const inputStr = (inputs[0] || '').replace(/\D/g, '');
            if (inputStr.length === 0) {
                return { lines: [], count: 0, bet: bet || 0 };
            }
            if (isBB) {
                if (inputStr.length !== digitCount) {
                    return { lines: [], count: 0, bet: bet || 0 };
                }
                results = generateBB(inputStr);
            } else if (isBBFS) {
                if (inputStr.length < digitCount) {
                    return { lines: [], count: 0, bet: bet || 0 };
                }
                results = generateBBFS(inputStr, digitCount);
            } else {
                if (inputStr.length < digitCount) {
                    return { lines: [], count: 0, bet: bet || 0 };
                }
                results = generateBBFS(inputStr, digitCount);
            }
        }

        const set = new Set();
        const uniq = [];
        for (const r of results) {
            if (!set.has(r)) {
                set.add(r);
                uniq.push(r);
            }
        }
        results = uniq;

        return {
            lines: results,
            count: results.length,
            bet: bet || 0
        };
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function renderForms() {
        if (forms.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:30px 0;color:#64748b;font-size:15px;">
                    Belum ada form. Klik "Tambah Form" untuk mulai.
                </div>
            `;
            formCountInfo.textContent = '0 form';
            return;
        }

        let html = '';
        for (let i = 0; i < forms.length; i++) {
            const f = forms[i];
            const idx = i + 1;
            const isPoltar = f.fungsi.poltar || false;
            const digitCount = getDigitCount(f.tipe);

            // ---- Input fields ----
            let inputHtml = '';
            if (isPoltar) {
                inputHtml = `<div class="input-group">`;
                for (let d = 0; d < digitCount; d++) {
                    const val = f.inputs[d] || '';
                    inputHtml += `
                        <input type="text" class="poltar-input" 
                               data-formidx="${i}" data-didx="${d}" 
                               value="${val}" placeholder="${d+1}" 
                               inputmode="numeric" pattern="[0-9]*" />
                    `;
                }
                inputHtml += `</div>`;
            } else {
                const val = f.inputs[0] || '';
                inputHtml = `
                    <input type="text" class="single-input" 
                           data-formidx="${i}" 
                           value="${val}" 
                           placeholder="contoh: 12345" 
                           inputmode="numeric" pattern="[0-9]*" />
                `;
            }

            // ---- Checkbox status ----
            const chkBB = f.fungsi.bb ? 'checked' : '';
            const chkBBFS = f.fungsi.bbfs ? 'checked' : '';
            const chkPoltar = f.fungsi.poltar ? 'checked' : '';

            // ---- Twin visibility ----
            const showTwin = isPoltar && digitCount >= 2;
            const showTwinTwin = isPoltar && digitCount >= 4;
            const showTriplet = isPoltar && digitCount >= 3;
            const showFourplet = isPoltar && digitCount >= 5;

            const chkTwin = f.twinModes.twin ? 'checked' : '';
            const chkTwinTwin = f.twinModes.twintwin ? 'checked' : '';
            const chkTriplet = f.twinModes.tripletwin ? 'checked' : '';
            const chkFourplet = f.twinModes.fourpletwin ? 'checked' : '';

            // ---- Preview ----
            const previewResult = processForm(f);
            let previewText = '';
            if (previewResult.count > 0) {
                previewText = `${previewResult.count} line${previewResult.count>1?'s':''} · ${formatRupiah(previewResult.bet)}`;
            } else {
                if (isPoltar) {
                    const filled = f.inputs.slice(0, digitCount).filter(s => s.replace(/\D/g, '').length > 0).length;
                    previewText = `⏳ ${filled}/${digitCount} input diisi`;
                } else {
                    const inputVal = (f.inputs[0] || '').replace(/\D/g, '');
                    if (inputVal.length === 0) {
                        previewText = '⏳ isi input';
                    } else if (f.fungsi.bb && inputVal.length !== digitCount) {
                        previewText = `⚠️ BB butuh ${digitCount} digit`;
                    } else if ((f.fungsi.bbfs || !f.fungsi.bb) && inputVal.length < digitCount) {
                        previewText = `⚠️ minimal ${digitCount} digit`;
                    } else {
                        previewText = '⏳ tidak ada kombinasi';
                    }
                }
            }

            // ---- Susun HTML dengan top-row ----
            html += `
                <div class="form-card" data-formidx="${i}">
                    <div class="top-row">
                        <span class="form-index">#${idx}</span>
                        <select class="tipe-select" data-formidx="${i}">
                            <option value="5d" ${f.tipe==='5d'?'selected':''}>5D</option>
                            <option value="4d" ${f.tipe==='4d'?'selected':''}>4D</option>
                            <option value="3d" ${f.tipe==='3d'?'selected':''}>3D</option>
                            <option value="2d" ${f.tipe==='2d'?'selected':''}>2D</option>
                        </select>
                        <button class="btn-remove" data-formidx="${i}" title="Hapus form">✕</button>
                    </div>

                    <div class="check-group">
                        <label><input type="checkbox" class="fungsi-chk" data-formidx="${i}" data-fn="bb" ${chkBB} /> BB</label>
                        <label><input type="checkbox" class="fungsi-chk" data-formidx="${i}" data-fn="bbfs" ${chkBBFS} /> BBFS</label>
                        <label><input type="checkbox" class="fungsi-chk" data-formidx="${i}" data-fn="poltar" ${chkPoltar} /> POLTAR</label>
                    </div>

                    <div class="twin-group ${isPoltar ? '' : 'hidden'}">
                        <span class="twin-label">Twin:</span>
                        <label class="${showTwin ? '' : 'hidden'}">
                            <input type="checkbox" class="twin-chk" data-formidx="${i}" data-mode="twin" ${chkTwin} />
                            Twin
                        </label>
                        <label class="${showTwinTwin ? '' : 'hidden'}">
                            <input type="checkbox" class="twin-chk" data-formidx="${i}" data-mode="twintwin" ${chkTwinTwin} />
                            TwinTwin
                        </label>
                        <label class="${showTriplet ? '' : 'hidden'}">
                            <input type="checkbox" class="twin-chk" data-formidx="${i}" data-mode="tripletwin" ${chkTriplet} />
                            Triplet
                        </label>
                        <label class="${showFourplet ? '' : 'hidden'}">
                            <input type="checkbox" class="twin-chk" data-formidx="${i}" data-mode="fourpletwin" ${chkFourplet} />
                            Fourplet
                        </label>
                        <span class="twin-badge">${isPoltar ? 'filter' : '–'}</span>
                    </div>

                    ${inputHtml}

                    <input type="number" class="bet-input" data-formidx="${i}" 
                           value="${f.bet}" min="0" step="100" />

                    <span class="preview-text" id="preview_${i}">${previewText}</span>
                </div>
            `;
        }
        container.innerHTML = html;
        formCountInfo.textContent = `${forms.length} form`;
        attachEvents();
    }

    // ============================================================
    //  EVENTS
    // ============================================================
    function attachEvents() {
        document.querySelectorAll('.btn-remove').forEach(btn => {
            btn.onclick = function(e) {
                const idx = parseInt(this.dataset.formidx, 10);
                removeForm(idx);
            };
        });

        document.querySelectorAll('.tipe-select').forEach(sel => {
            sel.onchange = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                const newTipe = this.value;
                const newDigitCount = getDigitCount(newTipe);
                forms[idx].tipe = newTipe;
                if (forms[idx].fungsi.poltar) {
                    while (forms[idx].inputs.length < newDigitCount) {
                        forms[idx].inputs.push('');
                    }
                    while (forms[idx].inputs.length > newDigitCount) {
                        forms[idx].inputs.pop();
                    }
                }
                renderForms();
            };
        });

        // --- Fungsi checkbox (mutual exclusive tapi boleh semua mati) ---
        document.querySelectorAll('.fungsi-chk').forEach(chk => {
            chk.onchange = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                const fn = this.dataset.fn;

                if (this.checked) {
                    const others = ['bb', 'bbfs', 'poltar'].filter(f => f !== fn);
                    for (const other of others) {
                        forms[idx].fungsi[other] = false;
                    }
                    forms[idx].fungsi[fn] = true;
                } else {
                    forms[idx].fungsi[fn] = false;
                }

                if (fn === 'poltar' && forms[idx].fungsi.poltar) {
                    const digitCount = getDigitCount(forms[idx].tipe);
                    const newInputs = [];
                    for (let i = 0; i < digitCount; i++) {
                        newInputs.push(forms[idx].inputs[i] || '');
                    }
                    forms[idx].inputs = newInputs;
                } else if (fn === 'poltar' && !forms[idx].fungsi.poltar) {
                    const combined = forms[idx].inputs.join('');
                    forms[idx].inputs = [combined];
                    forms[idx].twinModes = { twin: false, twintwin: false, tripletwin: false, fourpletwin: false };
                }

                renderForms();
            };
        });

        document.querySelectorAll('.twin-chk').forEach(chk => {
            chk.onchange = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                const mode = this.dataset.mode;
                forms[idx].twinModes[mode] = this.checked;
                renderForms();
            };
        });

        document.querySelectorAll('.poltar-input').forEach(inp => {
            inp.oninput = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                const didx = parseInt(this.dataset.didx, 10);
                let val = this.value.replace(/\D/g, '');
                this.value = val;
                forms[idx].inputs[didx] = val;
                updatePreview(idx);
            };
            inp.onblur = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                updatePreview(idx);
            };
        });

        document.querySelectorAll('.single-input').forEach(inp => {
            inp.oninput = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                let val = this.value.replace(/\D/g, '');
                this.value = val;
                forms[idx].inputs[0] = val;
                updatePreview(idx);
            };
            inp.onblur = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                updatePreview(idx);
            };
        });

        document.querySelectorAll('.bet-input').forEach(inp => {
            inp.oninput = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                const val = parseInt(this.value, 10) || 0;
                forms[idx].bet = val;
                updatePreview(idx);
            };
            inp.onblur = function() {
                const idx = parseInt(this.dataset.formidx, 10);
                updatePreview(idx);
            };
        });

        for (let i = 0; i < forms.length; i++) {
            updatePreview(i);
        }
    }

    // ============================================================
    //  UPDATE PREVIEW
    // ============================================================
    function updatePreview(idx) {
        const f = forms[idx];
        const result = processForm(f);
        const previewEl = document.getElementById(`preview_${idx}`);
        if (previewEl) {
            if (result.count > 0) {
                previewEl.textContent = `${result.count} line${result.count>1?'s':''} · ${formatRupiah(result.bet)}`;
            } else {
                const isPoltar = f.fungsi.poltar || false;
                const digitCount = getDigitCount(f.tipe);
                if (isPoltar) {
                    const filled = f.inputs.slice(0, digitCount).filter(s => s.replace(/\D/g, '').length > 0).length;
                    previewEl.textContent = `⏳ ${filled}/${digitCount} input diisi`;
                } else {
                    const inputVal = (f.inputs[0] || '').replace(/\D/g, '');
                    if (inputVal.length === 0) {
                        previewEl.textContent = '⏳ isi input';
                    } else if (f.fungsi.bb && inputVal.length !== digitCount) {
                        previewEl.textContent = `⚠️ BB butuh ${digitCount} digit`;
                    } else if ((f.fungsi.bbfs || !f.fungsi.bb) && inputVal.length < digitCount) {
                        previewEl.textContent = `⚠️ minimal ${digitCount} digit`;
                    } else {
                        previewEl.textContent = '⏳ tidak ada kombinasi';
                    }
                }
            }
        }
        updateTotalBadge();
    }

    // ============================================================
    //  GENERATE ALL
    // ============================================================
    function generateAll() {
        const delim = delimForm.value;
        const antar = delimAntar.value;

        const allResults = [];
        let totalLines = 0;
        let totalBet = 0;
        let hasError = false;

        for (let i = 0; i < forms.length; i++) {
            const f = forms[i];
            const result = processForm(f);
            if (result.count === 0) {
                const isPoltar = f.fungsi.poltar || false;
                const digitCount = getDigitCount(f.tipe);
                if (isPoltar) {
                    const filled = f.inputs.slice(0, digitCount).filter(s => s.replace(/\D/g, '').length > 0).length;
                    if (filled !== digitCount) {
                        hasError = true;
                        continue;
                    }
                } else {
                    const inputVal = (f.inputs[0] || '').replace(/\D/g, '');
                    if (f.fungsi.bb && inputVal.length !== digitCount) {
                        hasError = true;
                        continue;
                    }
                    if ((f.fungsi.bbfs || !f.fungsi.bb) && inputVal.length < digitCount && inputVal.length > 0) {
                        hasError = true;
                        continue;
                    }
                    if (inputVal.length === 0) {
                        hasError = true;
                        continue;
                    }
                }
            }
            if (result.count === 0) continue;
            const output = result.lines.join(delim);
            const betStr = result.bet;
            const finalStr = output + '#' + betStr;
            allResults.push(finalStr);
            totalLines += result.count;
            totalBet += result.bet * result.count;
        }

        // Tampilkan output
        outputSection.classList.add('visible');

        if (allResults.length === 0) {
            if (hasError) {
                outputBox.textContent = '⚠️ Ada form dengan input tidak sesuai aturan. Perbaiki input.';
            } else {
                outputBox.textContent = '⚠️ Tidak ada hasil. Isi input dengan benar.';
            }
            outputBox.classList.remove('empty');
            totalLinesEl.textContent = '0';
            totalBetEl.textContent = 'Rp 0';
            // Reset copy button state
            copyButton.textContent = '📋 Salin';
            copyButton.classList.remove('copied');
        } else {
            const combined = allResults.join(antar);
            outputBox.textContent = combined;
            outputBox.classList.remove('empty');

            totalLinesEl.textContent = totalLines;
            totalBetEl.textContent = formatRupiah(totalBet);
            // Reset copy button state
            copyButton.textContent = '📋 Salin';
            copyButton.classList.remove('copied');
        }

        // Scroll ke output
        outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

        for (let i = 0; i < forms.length; i++) {
            updatePreview(i);
        }
    }

    // ============================================================
    //  COPY TO CLIPBOARD
    // ============================================================
    function copyOutput() {
        const text = outputBox.textContent;
        if (!text || text === 'Klik "Generate Semua" untuk melihat hasil' || text.startsWith('⚠️')) {
            // Tidak ada konten yang berarti
            copyButton.textContent = '⚠️ Kosong';
            setTimeout(() => {
                copyButton.textContent = '📋 Salin';
            }, 1500);
            return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                copyButton.textContent = '✅ Tersalin!';
                copyButton.classList.add('copied');
                setTimeout(() => {
                    copyButton.textContent = '📋 Salin';
                    copyButton.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        // Fallback untuk browser lama
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            copyButton.textContent = '✅ Tersalin!';
            copyButton.classList.add('copied');
            setTimeout(() => {
                copyButton.textContent = '📋 Salin';
                copyButton.classList.remove('copied');
            }, 2000);
        } catch (e) {
            copyButton.textContent = '❌ Gagal';
            setTimeout(() => {
                copyButton.textContent = '📋 Salin';
            }, 1500);
        }
        document.body.removeChild(textarea);
    }

    // ============================================================
    //  UPDATE TOTAL BADGE
    // ============================================================
    function updateTotalBadge() {
        let totalLines = 0;
        let totalBet = 0;
        for (let i = 0; i < forms.length; i++) {
            const f = forms[i];
            const result = processForm(f);
            totalLines += result.count;
            totalBet += result.bet * result.count;
        }
        totalLinesEl.textContent = totalLines;
        totalBetEl.textContent = formatRupiah(totalBet);
    }

    // ============================================================
    //  ADD / REMOVE FORM
    // ============================================================
    function addForm() {
        formCounter++;
        const tipe = '4d';
        const newForm = {
            id: formCounter,
            tipe: tipe,
            fungsi: { bb: false, bbfs: false, poltar: false },
            twinModes: { twin: false, twintwin: false, tripletwin: false, fourpletwin: false },
            inputs: [''],
            bet: 100,
        };
        forms.push(newForm);
        renderForms();
        setTimeout(() => {
            const firstInput = document.querySelector('.single-input, .poltar-input');
            if (firstInput) firstInput.focus();
        }, 50);
        updateTotalBadge();
    }

    function removeForm(idx) {
        if (forms.length <= 1) {
            if (!confirm('Hapus form terakhir?')) return;
        }
        forms.splice(idx, 1);
        renderForms();
        updateTotalBadge();
        if (forms.length === 0) {
            outputBox.textContent = 'Belum ada form. Tambahkan form untuk mulai.';
            outputBox.classList.add('empty');
            totalLinesEl.textContent = '0';
            totalBetEl.textContent = 'Rp 0';
            outputSection.classList.remove('visible');
            copyButton.textContent = '📋 Salin';
            copyButton.classList.remove('copied');
        }
    }

    // ============================================================
    //  UTILITY
    // ============================================================
    function formatRupiah(num) {
        if (num === 0) return 'Rp 0';
        return 'Rp ' + num.toLocaleString('id-ID');
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.getElementById('btnAddForm').addEventListener('click', addForm);
    document.getElementById('btnGenerateAll').addEventListener('click', generateAll);
    copyButton.addEventListener('click', copyOutput);

    delimForm.addEventListener('change', () => {
        if (outputSection.classList.contains('visible')) {
            generateAll();
        }
    });
    delimAntar.addEventListener('change', () => {
        if (outputSection.classList.contains('visible')) {
            generateAll();
        }
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            generateAll();
        }
    });

    addForm();
</script>
</body>
</html>
