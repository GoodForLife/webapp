<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pola Tarung Generator | LIST & WAP + Bet</title>
  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
body{background:#0a0f1a;font-family:Segoe UI,Roboto,system-ui,sans-serif}.card-custom{background:#141c2c;border:1px solid #2a3649;border-radius:1.8rem;box-shadow:0 20px 35px -12px rgba(0,0,0,.5)}.card-header-custom{background:#0f1622;color:#eef4ff;border-radius:1.8rem 1.8rem 1rem 1rem!important;border-bottom:1px solid #2a3a50;padding:1rem 1.5rem;font-weight:700;text-align:center}.form-label{font-weight:600;color:#cbdff2;margin-bottom:.3rem;font-size:.9rem}.form-control,.form-control:focus{background-color:#0f1825;border:1px solid #2e405b;color:#f0f3fa;border-radius:1.2rem;font-weight:500;font-family:monospace;font-size:1rem;text-align:center}.form-control:focus{border-color:#5b8cbb;box-shadow:0 0 0 3px rgba(91,140,187,.25);background-color:#111c2c}.filter-card{background:#0f1725;border-radius:1.5rem;padding:.6rem 1.2rem;border:1px solid #28344a;display:inline-flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}.filter-label{font-weight:600;color:#cddef5;cursor:pointer;margin-left:.5rem}.form-check-input{background-color:#1e2a3e;border-color:#4b6e8f;cursor:pointer}.form-check-input:checked{background-color:#2c5a8c;border-color:#3c7bb0}.result-header{background:#0f1825;border-radius:1.2rem;padding:.5rem 1.2rem;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a3a4a}.badge-mini{background:#1f324b;border-radius:2rem;padding:.25rem .9rem;font-size:.8rem;font-weight:600;color:#cde2ff}.output-textarea{background:#03060c;border:1px solid #2e4a6a;border-radius:1.2rem;color:#eaf4ff;font-family:JetBrains Mono,Fira Code,monospace;font-size:.9rem;line-height:1.5;resize:vertical}.output-textarea:focus{background:#07111f;border-color:#5f8ec0;box-shadow:0 0 0 2px rgba(44,90,140,.3333333333333333)}.btn-generate{background:#2a4468;border-radius:2rem;padding:.6rem 2rem;font-weight:600;color:#fff;border:none;transition:.2s;min-width:160px}.btn-generate:hover{background:#1d3452;transform:scale(.97);box-shadow:0 5px 12px rgba(0,0,0,.3)}.btn-copy-result{background:#1f3b4f;border-radius:2rem;padding:.4rem 1.2rem;font-weight:500;color:#eaf6ff;border:1px solid #3a6280;font-size:.85rem}.btn-copy-result:hover{background:#2a4d6e;color:#fff}.info-note{background:#0e1624;border-radius:1rem;padding:.6rem 1rem;color:#aec3e0;font-size:.75rem;border:1px solid #26334a;text-align:center}footer{font-size:.7rem;color:#6b85a4;text-align:center}.filter-wrapper{text-align:center;margin-bottom:1rem}.generate-wrapper{text-align:center;margin:1.2rem 0 1rem}.mode-selector{background:#0f1725;border-radius:1.5rem;padding:.6rem 1.2rem;border:1px solid #28344a;display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}.mode-label{color:#cddef5;font-weight:500;margin-right:.5rem}.custom-select,.custom-select:focus{background-color:#0f1825;border:1px solid #2e405b;color:#eef4ff;border-radius:1.2rem;padding:.4rem 1rem;font-weight:500;cursor:pointer}.delimiter-group{display:inline-flex;align-items:center;gap:.5rem}.bet-input{width:80px;display:inline-block;background-color:#0f1825;border:1px solid #2e405b;color:#fff;border-radius:1.2rem;text-align:center;padding:.3rem .5rem}.bet-input:focus{border-color:#5b8cbb;box-shadow:0 0 0 2px rgba(44,90,140,.3333333333333333)}hr{opacity:.3}
  </style>
</head>
<body class="bg-dark bg-opacity-95">
<div class="container ">
  <div class="row justify-content-center">
    <div class="col-lg-10 col-xl-9">
      <div class="card card-custom">
        <div class="card-header-custom">
          <h3 class="mb-0 fs-4"><i class="fas fa-dice-d6 me-2"></i> POLA TARUNG GENERATOR</h3>
          <small class="text-secondary-emphasis">AS · KOP · KEPALA · EKOR</small>
        </div>
        
        <div class="card-body p-4 p-md-1">
          <!-- Input area -->
          <div class="row g-3 mb-4">
            <div class="col-md-3 col-sm-6">
              <label class="form-label text-center w-100">AS</label>
              <input type="text" id="inputAs" class="form-control text-center" placeholder="Input AS" value="1">
            </div>
            <div class="col-md-3 col-sm-6">
              <label class="form-label text-center w-100">KOP</label>
              <input type="text" id="inputKop" class="form-control text-center" placeholder="Input KOP" value="2">
            </div>
            <div class="col-md-3 col-sm-6">
              <label class="form-label text-center w-100">KEPALA</label>
              <input type="text" id="inputKepala" class="form-control text-center" placeholder="Input Kepala" value="3">
            </div>
            <div class="col-md-3 col-sm-6">
              <label class="form-label text-center w-100">EKOR</label>
              <input type="text" id="inputEkor" class="form-control text-center" placeholder="Input Ekor" value="4">
            </div>
          </div>
          
          <!-- Filter switches (3 filter) -->
          <div class="filter-wrapper">
            <div class="filter-card">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterTriplet" checked>
                <label class="form-check-label filter-label" for="filterTriplet">
                 Triple (1112)
                </label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterDuplet">
                <label class="form-check-label filter-label" for="filterDuplet">
                 Double (1123)
                </label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterDouble">
                <label class="form-check-label filter-label" for="filterDouble">
                  Doubled (1122)
                </label>
              </div>
            </div>
          </div>

          <!-- Mode Output: LIST / WAP + delimiter + Bet (hanya WAP) -->
          <div class="mode-selector">
            <div class="d-flex align-items-center gap-2">
              <span class="mode-label"><i class="fas fa-chart-simple me-1"></i>Output:</span>
              <select id="outputMode" class="custom-select">
                <option value="LIST" selected>LIST</option>
                <option value="WAP">WAP</option>
              </select>
            </div>
            <div id="delimiterContainer" class="delimiter-group" style="display: none;">
              <span class="mode-label">, Delimiter:</span>
              <select id="delimiterSelect" class="custom-select">
                <option value="*">*</option>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="#">#</option>
                <option value=",">,</option>
              </select>
              <span class="mode-label ms-2">, Bet:</span>
              <input type="number" id="betInput" class="bet-input" value="100" min="0" step="1">
            </div>
          </div>
          
          <!-- Tombol Generate -->
          <div class="generate-wrapper">
            <button id="btnGenerate" class="btn-generate"><i class="fas fa-sync-alt me-2"></i> Generate</button>
          </div>
          
          <!-- Result header: badge + copy -->
          <div class="result-header mb-2">
            <div class="badge-mini" id="totalCountDisplay">0 angka</div>
            <button id="btnCopyResult" class="btn-copy-result"><i class="fas fa-clipboard me-1"></i> Salin Hasil</button>
          </div>
          
          <!-- Text area output -->
          <textarea id="outputTextArea" class="output-textarea form-control w-100 p-2" rows="12" readonly placeholder="Hasil kombinasi akan muncul di sini...&#10;Mode LIST = setiap angka baris baru.&#10;Mode WAP = semua angka digabung delimiter + #bet di akhir." style="font-family: monospace;"></textarea>
          
        </div>
        <div class="card-footer bg-transparent border-0 text-center pb-4">
          <footer><i class="fas fa-moon me-1"></i> Dark Mode · 3 Filter · LIST/WAP + Bet · Copy</footer>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function parseDigits(e){if(!e)return[];const t=String(e).trim(),n=[];for(let e of t)/[0-9]/.test(e)&&n.push(e);return n}function generateCartesian(e,t,n,i){const l=[];for(let o of e)for(let e of t)for(let t of n)for(let n of i)l.push(`${o}${e}${t}${n}`);return l}function hasTripletOrMore(e){const t={};for(let n of e)if(t[n]=(t[n]||0)+1,t[n]>=3)return!0;return!1}function hasAnyDuplicate(e){const t={};for(let n of e)if(t[n]=(t[n]||0)+1,t[n]>=2)return!0;return!1}function hasDoublePattern(e){const t={};for(let n of e)t[n]=(t[n]||0)+1;const n=Object.values(t);return 2===n.length&&n.every(e=>2===e)}function sortResultsNumerically(e){return e.slice().sort((e,t)=>parseInt(e,10)-parseInt(t,10))}function formatFourDigit(e){return 4===e.length?e:e.padStart(4,"0")}function toggleDelimiterVisibility(){const e=document.getElementById("outputMode").value;document.getElementById("delimiterContainer").style.display="WAP"===e?"inline-flex":"none"}function generateAndUpdate(){const e=document.getElementById("inputAs").value,t=document.getElementById("inputKop").value,n=document.getElementById("inputKepala").value,i=document.getElementById("inputEkor").value,l=parseDigits(e),o=parseDigits(t),r=parseDigits(n),a=parseDigits(i),u=document.getElementById("totalCountDisplay"),d=document.getElementById("outputTextArea");if(0===l.length||0===o.length||0===r.length||0===a.length)return d.value="⚠️ Error: Setiap posisi (AS, KOP, KEPALA, EKOR) harus memiliki minimal 1 digit angka (0-9).",void(u.innerText="0 angka");let c=generateCartesian(l,o,r,a);if(0===c.length)return d.value="Tidak ada kombinasi yang dihasilkan.",void(u.innerText="0 angka");const s=document.getElementById("filterTriplet").checked,m=document.getElementById("filterDuplet").checked,g=document.getElementById("filterDouble").checked;const f=sortResultsNumerically(c.filter(e=>{let t=!0;return s&&hasTripletOrMore(e)&&(t=!1),t&&m&&hasAnyDuplicate(e)&&(t=!1),t&&g&&hasDoublePattern(e)&&(t=!1),t}));if(0===f.length)return d.value="🔍 Tidak ada hasil setelah filter. Coba ubah input atau nonaktifkan filter.",void(u.innerText="0 angka");const p=f.map(e=>formatFourDigit(e));let y="";if("LIST"===document.getElementById("outputMode").value)y=p.join("\n");else{const e=document.getElementById("delimiterSelect").value,t=document.getElementById("betInput").value.trim(),n=""===t||isNaN(t)?0:parseInt(t,10);y=p.join(e)+"#"+n}d.value=y,u.innerText=`${f.length} angka`}async function copyResults(){const e=document.getElementById("outputTextArea").value,t=document.getElementById("btnCopyResult");if(!e||""===e.trim()||e.includes("Error")||e.includes("Tidak ada hasil")||e.includes("🔍")){const e=t.innerHTML;return t.innerHTML='<i class="fas fa-exclamation-triangle me-1"></i> Kosong',t.style.background="#8b5a2b",void setTimeout(()=>{t.innerHTML=e,t.style.background="#1f3b4f"},1200)}try{await navigator.clipboard.writeText(e);const n=t.innerHTML;t.innerHTML='<i class="fas fa-check-circle me-1"></i> Tersalin!',t.style.background="#2a6b4e",setTimeout(()=>{t.innerHTML=n,t.style.background="#1f3b4f"},1500)}catch(e){alert("Gagal menyalin: "+e)}}function init(){const e=document.getElementById("btnGenerate"),t=document.getElementById("btnCopyResult"),n=document.getElementById("outputMode"),i=document.getElementById("delimiterSelect"),l=document.getElementById("betInput"),o=()=>generateAndUpdate();["inputAs","inputKop","inputKepala","inputEkor"].forEach(e=>{const t=document.getElementById(e);t&&t.addEventListener("input",o)}),["filterTriplet","filterDuplet","filterDouble"].forEach(e=>{const t=document.getElementById(e);t&&t.addEventListener("change",o)}),e&&e.addEventListener("click",o),t&&t.addEventListener("click",copyResults),n&&n.addEventListener("change",()=>{toggleDelimiterVisibility(),o()}),i&&i.addEventListener("change",o),l&&l.addEventListener("input",o);const r=document.getElementById("filterTriplet"),a=document.getElementById("filterDuplet"),u=document.getElementById("filterDouble");r&&(r.checked=!1),a&&(a.checked=!1),u&&(u.checked=!1);const d=document.getElementById("outputMode");d&&(d.value="LIST"),toggleDelimiterVisibility(),o()}window.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
